<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Isaiah Campusano</title>
  <meta name="description" content="Every optimization leaves something behind.">
  <link rel="canonical" href="https://isaiahcampusano.github.io/zay/">
  <meta property="og:title" content="Isaiah Campusano">
  <meta property="og:description" content="Every optimization leaves something behind.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #0b0d10;
      --ink: #f1eee8;
      --muted: #a2a8b1;
      --accent: #8fb5ff;
      --mono: "IBM Plex Mono", monospace;
      --sans: "Manrope", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .container {
      max-width: 36rem;
    }
    .emblem {
      display: block;
      width: 140px;
      height: 140px;
      margin: 0 auto 2.5rem;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(0.4) contrast(1.1);
      border: 2px solid rgba(241,238,232,0.12);
    }
    .fragment {
      font-family: var(--mono);
      font-size: clamp(1.8rem, 5.5vw, 3.2rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }
    .second-line {
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      line-height: 1.7;
      margin-bottom: 2.75rem;
    }
    .paper-train {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .paper-train a {
      color: var(--ink);
      text-decoration-color: rgba(143,181,255,0.5);
      text-underline-offset: 0.25em;
    }
    .paper-train a:hover {
      color: var(--accent);
    }
    .sub-links {
      margin-top: 0.8rem;
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      font-size: 0.72rem;
    }
    .sub-links a {
      color: var(--muted);
      text-decoration: none;
    }
    .sub-links a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main class="container">
    <!-- Replace this src with your own emblem/image -->
    <img class="emblem" src="https://images.unsplash.com/photo-1590497015425-5f7c1dfc3f06?w=300&h=300&fit=crop&crop=face" alt="Marble statue" loading="eager">

    <h1 class="fragment">The constraint is the only<br>honest part.</h1>
    <p class="second-line">
      I build interfaces and agents that make the hidden rules visible.
    </p>

    <div class="paper-train">
      <p>If that sounds like your kind of game,<br><a href="mailto:inc67651@uga.edu">inc67651@uga.edu</a></p>
      <div class="sub-links">
        <a href="assets/Isaiah-Campusano-Resume.pdf" target="_blank" rel="noreferrer">résumé</a>
        <a href="https://github.com/isaiahcampusano" target="_blank" rel="noreferrer">github</a>
        <a href="https://www.linkedin.com/in/isaiah-campusano-802535266/" target="_blank" rel="noreferrer">linkedin</a>
      </div>
    </div>
  </main>
</body>
</html>
